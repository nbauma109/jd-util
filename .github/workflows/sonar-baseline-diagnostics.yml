name: Sonar baseline diagnostics

on:
  push:
    branches:
      - diagnostics/sonar-baseline-229

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect issue ranges and resolution states on master
        run: |
          python3 - <<'PY'
          import collections
          import json
          import urllib.parse
          import urllib.request

          project = "nbauma109_jd-util"
          def get(endpoint, **params):
              url = "https://sonarcloud.io/api/" + endpoint + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=60) as response:
                  return json.load(response)

          print("ANALYSIS", json.dumps(get("project_analyses/search", project=project, branch="master", ps=1)))
          for resolved in ("false", "true"):
              page = 1
              issues = []
              while True:
                  result = get("issues/search", componentKeys=project, branch="master",
                               resolved=resolved, rules="java:S125,java:S1130,java:S2259",
                               p=page, ps=500)
                  issues.extend(result["issues"])
                  if len(issues) >= result["total"]:
                      break
                  page += 1
              print("STATE_COUNTS", resolved, json.dumps(collections.Counter((issue["rule"] + ":" + issue["status"] + ":" + issue.get("resolution", "")) for issue in issues)))
              for issue in issues:
                  path = issue["component"].split(":", 1)[-1]
                  if (path.endswith(("SignatureParserTest.java", "JavaFragmentToTokenTest.java",
                                     "DefaultStack.java", "MethodBodyRangeTest.java", "CompilationUnitVisitor.java"))):
                      print("ISSUE", json.dumps({key: issue.get(key) for key in
                          ("key", "component", "rule", "line", "textRange", "status", "resolution", "message")}))
          for key in ("java:S6539", "java:S2259", "java:S1874"):
              try:
                  response = get("rules/show", key=key)
                  rule = response["rule"]
                  print("RULE", json.dumps({name: rule.get(name) for name in ("key", "name", "status", "scope", "params")}))
              except Exception as error:
                  print("RULE_ERROR", key, error)
          PY
