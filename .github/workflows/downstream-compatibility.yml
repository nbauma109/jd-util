name: Downstream compatibility

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    uses: ./.github/workflows/prepare-maven.yml

  candidate:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.downstream-cache.outputs.cache-primary-key }}
      jd-core-ref: ${{ steps.downstream-revisions.outputs.jd-core-ref }}
      jd-core-v0-ref: ${{ steps.downstream-revisions.outputs.jd-core-v0-ref }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Maven repositories
        run: install -D .github/maven-settings.xml "$HOME/.m2/settings.xml"
      - name: Restore prepared Maven repository
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ needs.prepare.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Build jd-util
        run: mvn -B --no-transfer-progress -DskipTests package
      - name: Download JaCoCo command-line tool
        run: mvn -B --no-transfer-progress dependency:copy -Dartifact=org.jacoco:org.jacoco.cli:0.8.16:jar:nodeps -DoutputDirectory=target
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: jd-util-candidate
          path: |
            pom.xml
            target/jd-util-*.jar
            target/org.jacoco.cli-0.8.16-nodeps.jar
          if-no-files-found: error

      - name: Check out jd-core for dependency preparation
        uses: actions/checkout@v7
        with:
          repository: nbauma109/jd-core
          ref: master
          path: downstream-jd-core
          persist-credentials: false
      - name: Check out jd-core-v0 for dependency preparation
        uses: actions/checkout@v7
        with:
          repository: nbauma109/jd-core-v0
          ref: master
          path: downstream-jd-core-v0
          persist-credentials: false
      - name: Record prepared downstream revisions
        id: downstream-revisions
        run: |
          echo "jd-core-ref=$(git -C downstream-jd-core rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "jd-core-v0-ref=$(git -C downstream-jd-core-v0 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore previously prepared downstream dependencies
        id: downstream-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ needs.prepare.outputs.cache-key }}-downstream-${{ hashFiles('downstream-jd-core/pom.xml', 'downstream-jd-core-v0/pom.xml', '.github/workflows/downstream-compatibility.yml', '.github/scripts/update-downstream-dependency.py') }}
          restore-keys: |
            ${{ needs.prepare.outputs.cache-key }}-downstream-
      - name: Prepare downstream dependencies
        if: steps.downstream-cache.outputs.cache-hit != 'true'
        run: |
          version=$(python3 .github/scripts/update-downstream-dependency.py pom.xml downstream-jd-core/pom.xml)
          python3 .github/scripts/update-downstream-dependency.py pom.xml downstream-jd-core-v0/pom.xml
          mvn -B -ntp install:install-file -Dfile="target/jd-util-$version.jar" -DpomFile=pom.xml
          mvn -B -ntp -f downstream-jd-core/pom.xml dependency:go-offline test-compile
          mvn -B -ntp -f downstream-jd-core-v0/pom.xml dependency:go-offline test-compile
          mvn -B -ntp -f downstream-jd-core-v0/pom.xml -Pecj dependency:go-offline test-compile
          rm -rf "$HOME/.m2/repository/io/github/nbauma109/jd-util/$version"
          find "$HOME/.m2/repository" -name '*.lastUpdated' -delete
      - name: Save prepared downstream Maven repository
        if: steps.downstream-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.downstream-cache.outputs.cache-primary-key }}

  compatibility:
    name: ${{ matrix.repository }} (Java ${{ matrix.java }}, ${{ matrix.suite }})
    needs: candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repository: jd-core, java: '17', suite: other-tests }
          - { repository: jd-core, java: '17', suite: testBCEL }
          - { repository: jd-core, java: '17', suite: testCommonsIO }
          - { repository: jd-core, java: '17.0.20', suite: testCommonsCodec }
          - { repository: jd-core, java: '17', suite: testCommonsCollections4 }
          - { repository: jd-core, java: '17', suite: testCommonsCompress }
          - { repository: jd-core, java: '17', suite: testCommonsCsv }
          - { repository: jd-core, java: '17', suite: testCommonsImaging }
          - { repository: jd-core, java: '17.0.20', suite: testCommonsLang3 }
          - { repository: jd-core, java: '17', suite: testCommonsMath3 }
          - { repository: jd-core, java: '17', suite: testCommonsNet }
          - { repository: jd-core, java: '17', suite: testCommonsText }
          - { repository: jd-core, java: '17', suite: testDiskLruCache }
          - { repository: jd-core, java: '17', suite: testGson }
          - { repository: jd-core, java: '17', suite: testJacksonCore }
          - { repository: jd-core, java: '17', suite: testJacksonDatabind }
          - { repository: jd-core, java: '17', suite: testGuavaAbstractFutureAndTesting }
          - { repository: jd-core, java: '17', suite: testGuavaConcurrentMathCacheAndGraph }
          - { repository: jd-core, java: '17', suite: testGuavaOthers }
          - { repository: jd-core, java: '17', suite: testJavaPoet }
          - { repository: jd-core, java: '17', suite: testJavaWriter }
          - { repository: jd-core, java: '17', suite: testJSoup }
          - { repository: jd-core, java: '17', suite: testJUnit4 }
          - { repository: jd-core, java: '17', suite: testMimecraft }
          - { repository: jd-core, java: '17', suite: testScribe }
          - { repository: jd-core, java: '17', suite: testSparkCore }
          - { repository: jd-core, java: '17', suite: testLog4jApi }
          - { repository: jd-core, java: '17', suite: testLog4jCore }
          - { repository: jd-core, java: '17', suite: testJodaTime }
          - { repository: jd-core-v0, java: '17', suite: javac }
          - { repository: jd-core-v0, java: '17', suite: ecj }
          - { repository: jd-core-v0, java: '21', suite: javac }
          - { repository: jd-core-v0, java: '21', suite: ecj }
          - { repository: jd-core-v0, java: '25', suite: javac }
          - { repository: jd-core-v0, java: '25', suite: ecj }

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: nbauma109/${{ matrix.repository }}
          ref: ${{ matrix.repository == 'jd-core' && needs.candidate.outputs.jd-core-ref || needs.candidate.outputs.jd-core-v0-ref }}
          path: downstream
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: jd-util-candidate
          path: candidate
      - name: Set up JDK 8 for the library tests
        if: matrix.repository == 'jd-core' && matrix.suite != 'other-tests'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - name: Remember JDK 8 home
        if: matrix.repository == 'jd-core' && matrix.suite != 'other-tests'
        run: echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Configure Maven repositories
        run: install -D .github/maven-settings.xml "$HOME/.m2/settings.xml"
      - name: Restore prepared downstream Maven repository
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ needs.candidate.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Cache library build dependencies
        if: matrix.repository == 'jd-core' && matrix.suite != 'other-tests'
        uses: actions/cache@v6.1.0
        with:
          path: downstream/target/m2-local
          key: ${{ runner.os }}-downstream-m2-local-${{ matrix.suite }}-${{ hashFiles('downstream/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-downstream-m2-local-${{ matrix.suite }}-
      - name: Seed nested Maven repository from prepared dependencies
        if: matrix.repository == 'jd-core' && matrix.suite != 'other-tests'
        shell: bash
        run: |
          mkdir -p downstream/target/m2-local
          rsync -a --ignore-existing \
            --exclude='*-SNAPSHOT/' \
            --exclude='*.lastUpdated' \
            --exclude='*.part' \
            --exclude='*.part.lock' \
            --exclude='maven-metadata-local.xml*' \
            --exclude='resolver-status.properties' \
            "$HOME/.m2/repository/" downstream/target/m2-local/
      - name: Install candidate and update downstream dependency
        shell: bash
        run: |
          version=$(python3 .github/scripts/update-downstream-dependency.py candidate/pom.xml downstream/pom.xml)

          candidate_jar="$GITHUB_WORKSPACE/candidate/target/jd-util-$version.jar"
          mvn -B --no-transfer-progress install:install-file \
            -Dfile="$candidate_jar" \
            -DpomFile=candidate/pom.xml
          echo "JD_UTIL_CANDIDATE_JAR=$candidate_jar" >> "$GITHUB_ENV"
      - name: Run downstream tests
        working-directory: downstream
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
          SUITE: ${{ matrix.suite }}
        run: |
          arguments=()

          if [[ "$REPOSITORY" == "jd-core" ]]; then
            if [[ "$SUITE" == "other-tests" ]]; then
              arguments+=("-Dtest=Test*,*Test,*Tests,*TestCase,!JarFileToJavaSourceTest")
            else
              arguments+=("-Dtest=JarFileToJavaSourceTest#$SUITE")
            fi
          elif [[ "$SUITE" == "ecj" ]]; then
            arguments+=("-Pecj")
          fi

          mvn -V -B --no-transfer-progress "${arguments[@]}" test jacoco:report
      - name: Generate jd-util coverage from downstream execution
        shell: bash
        run: |
          test -s downstream/target/jacoco.exec
          java -jar candidate/target/org.jacoco.cli-0.8.16-nodeps.jar report \
            downstream/target/jacoco.exec \
            --classfiles "$JD_UTIL_CANDIDATE_JAR" \
            --sourcefiles src/main/java \
            --name jd-util \
            --xml candidate/target/jd-util-coverage.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse("candidate/target/jd-util-coverage.xml")
          counter = report.find("./counter[@type='INSTRUCTION']")
          if counter is None or int(counter.get("covered", "0")) == 0:
              raise SystemExit("No coverage recorded for the jd-util candidate")
          PY
      - name: Upload jd-util downstream coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: candidate/target/jd-util-coverage.xml
          disable_search: true
          flags: ${{ matrix.repository }}
          name: ${{ matrix.repository }}-java-${{ matrix.java }}-${{ matrix.suite }}
          fail_ci_if_error: true
